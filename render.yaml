services:
  - type: web
    name: ridecircle-api
    runtime: node
    plan: starter
    buildCommand: "echo no build step needed"
    startCommand: "node server.js"
    disk:
      name: ridecircle-data
      # db.js resolves data files relative to the repo root at
      # __dirname/data — on Render that root is /opt/render/project/src
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
